services:
  - type: web
    name: curavia
    runtime: node
    region: frankfurt  # closest to Egypt; change to oregon/ohio if preferred
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curavia-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://curavia.onrender.com  # update after your service is created

databases:
  - name: curavia-db
    databaseName: curavia
    user: curavia
    region: frankfurt
    plan: free
